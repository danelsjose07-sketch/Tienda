<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Digital</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --card-2: #20242e;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --danger: #ef4444;
      --border: #2b303c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15, 17, 21, 0.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }

    .brand { font-size: 1.15rem; font-weight: 700; }
    .header-actions { display: flex; gap: 8px; }

    button {
      border: none; border-radius: 10px; padding: 9px 13px;
      font-weight: 600; cursor: pointer; font-size: 0.9rem;
      transition: 0.15s ease;
    }

    .btn-primary { background: var(--accent); color: #052e16; }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; }
    .btn-secondary { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; }

    .container { max-width: 980px; margin: 0 auto; padding: 16px; }

    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px;
    }

    input, select, textarea {
      width: 100%; background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-size: 0.95rem;
    }

    .search-input { flex: 1; min-width: 200px; }
    .cat-select { width: auto; min-width: 150px; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .product-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
    }

    .product-img {
      width: 100%; height: 160px; object-fit: cover; background: var(--card-2);
    }

    .product-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .product-cat { font-size: 0.75rem; color: var(--accent); text-transform: uppercase; font-weight: 700; }
    .product-title { font-size: 1rem; font-weight: 700; }
    .product-desc { font-size: 0.85rem; color: var(--muted); flex: 1; }
    .product-price { font-size: 1.05rem; font-weight: 800; margin-top: 4px; }

    .cart-bar {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 28px); max-width: 640px; z-index: 30;
      background: var(--card-2); border: 1px solid var(--accent);
      border-radius: 14px; padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: none; align-items: center; justify-content: center;
      padding: 16px; z-index: 50;
    }

    .modal-backdrop.active { display: flex; }

    .modal {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; width: 100%; max-width: 540px; max-height: 88vh;
      overflow-y: auto; padding: 18px;
    }

    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; }

    .admin-section {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-bottom: 18px;
    }

    .admin-item {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border);
    }

    .admin-item:last-child { border-bottom: none; }
    .status-msg { font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="brand" id="storeName">Cargando tienda...</div>
    <div class="header-actions">
      <button class="btn-secondary btn-sm" id="btnOpenAdmin">Admin</button>
      <button class="btn-primary btn-sm" id="btnOpenCart">Carrito (<span id="cartCount">0</span>)</button>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar productos..." />
      <select id="categoryFilter" class="cat-select">
        <option value="todas">Todas las categorías</option>
      </select>
    </div>

    <div class="grid" id="catalogGrid"></div>
    <p class="status-msg" id="catalogStatus"></p>
  </main>

  <div class="cart-bar" id="cartBar" style="display: none;">
    <div>
      <strong id="cartBarItems">0 productos</strong>
      <div class="status-msg" style="margin:0;" id="cartBarTotal">Total: $0.00</div>
    </div>
    <button class="btn-primary" id="btnQuickCart">Ver carrito</button>
  </div>

  <!-- Modal Carrito -->
  <div class="modal-backdrop" id="cartModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Tu pedido</h3>
        <button class="btn-secondary btn-sm" onclick="closeModal('cartModal')">Cerrar</button>
      </div>
      <div id="cartItemsList"></div>
      <div style="margin-top: 14px; font-weight: 700;" id="cartTotalText">Total: $0.00</div>
      <div class="form-group" style="margin-top: 12px;">
        <label for="customerName">Tu nombre (opcional)</label>
        <input type="text" id="customerName" placeholder="Ej. Carlos Pérez" />
      </div>
      <button class="btn-primary" style="width: 100%;" id="btnSendWhatsApp">Enviar pedido por WhatsApp</button>
    </div>
  </div>

  <!-- Modal Login / Admin -->
  <div class="modal-backdrop" id="adminModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="adminModalTitle">Acceso Administrador</h3>
        <button class="btn-secondary btn-sm" onclick="closeModal('adminModal')">Cerrar</button>
      </div>

      <div id="loginBox">
        <div class="form-group">
          <label for="adminUser">Usuario</label>
          <input type="text" id="adminUser" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="adminPass">Contraseña</label>
          <input type="password" id="adminPass" autocomplete="current-password" />
        </div>
        <button class="btn-primary" style="width: 100%;" id="btnLogin">Entrar al panel</button>
        <p class="status-msg" id="loginError"></p>
      </div>

      <div id="adminPanel" style="display: none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <span class="status-msg" style="margin:0; color: var(--accent);">Sesión activa</span>
          <button class="btn-secondary btn-sm" id="btnLogout">Cerrar sesión</button>
        </div>

        <div class="admin-section">
          <h4 style="margin-bottom: 10px;">Configuración de la tienda</h4>
          <div class="form-group">
            <label for="cfgNombre">Nombre de la tienda</label>
            <input type="text" id="cfgNombre" />
          </div>
          <div class="form-group">
            <label for="cfgWhatsapp">WhatsApp (con código de país, sin +)</label>
            <input type="text" id="cfgWhatsapp" placeholder="584120000000" />
          </div>
          <div class="form-group">
            <label for="cfgMoneda">Símbolo de moneda</label>
            <input type="text" id="cfgMoneda" placeholder="$" />
          </div>
          <button class="btn-primary btn-sm" id="btnSaveConfig">Guardar configuración</button>
          <p class="status-msg" id="cfgStatus"></p>
        </div>

        <div class="admin-section">
          <h4 style="margin-bottom: 10px;">Agregar producto</h4>
          <div class="form-group">
            <label for="prodNombre">Nombre</label>
            <input type="text" id="prodNombre" />
          </div>
          <div class="form-group">
            <label for="prodCategoria">Categoría</label>
            <input type="text" id="prodCategoria" placeholder="Ej. Tecnología" />
          </div>
          <div class="form-group">
            <label for="prodPrecio">Precio</label>
            <input type="number" step="0.01" id="prodPrecio" />
          </div>
          <div class="form-group">
            <label for="prodImagen">URL de imagen (opcional)</label>
            <input type="text" id="prodImagen" placeholder="https://..." />
          </div>
          <div class="form-group">
            <label for="prodDesc">Descripción</label>
            <textarea id="prodDesc" rows="2"></textarea>
          </div>
          <button class="btn-primary btn-sm" id="btnAddProduct">Publicar producto</button>
          <p class="status-msg" id="prodStatus"></p>
        </div>

        <div class="admin-section">
          <h4 style="margin-bottom: 8px;">Productos guardados</h4>
          <div id="adminProductsList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bjfpzgxwdbrnzdjyirrr.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_IhwewBZ17-k_4BziK_fxJg_UgSO-rr3";

    const ADMIN_USER = "V33679585_Danels";
    const ADMIN_PASS = "Dana2727.";

    let config = {
      id: 1,
      nombre_tienda: "Mi Tienda Digital",
      whatsapp: "584120000000",
      moneda: "$"
    };

    let products = [];
    let cart = [];
    let isLoggedIn = false;

    const headers = {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    };

    async function sbFetch(path, options = {}) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        ...options,
        headers: { ...headers, ...(options.headers || {}) }
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || `Error HTTP ${res.status}`);
      }
      if (res.status === 204) return null;
      return await res.json();
    }

    async function loadStoreData() {
      const statusEl = document.getElementById("catalogStatus");
      statusEl.textContent = "Conectando con Supabase...";
      try {
        const cfgRows = await sbFetch("configuracion?id=eq.1");
        if (Array.isArray(cfgRows) && cfgRows.length > 0) {
          config = cfgRows[0];
        }
        applyConfigToUI();

        const prodRows = await sbFetch("productos?order=id.desc");
        products = Array.isArray(prodRows) ? prodRows : [];
        populateCategories();
        renderCatalog();
        renderAdminProducts();
        statusEl.textContent = products.length === 0 ? "Aún no hay productos registrados." : "";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "No se pudo conectar con Supabase. Verifica que el sitio esté abierto desde una URL web y que las tablas existan.";
      }
    }

    function applyConfigToUI() {
      document.getElementById("storeName").textContent = config.nombre_tienda || "Tienda";
      document.title = config.nombre_tienda || "Catálogo Digital";
      document.getElementById("cfgNombre").value = config.nombre_tienda || "";
      document.getElementById("cfgWhatsapp").value = config.whatsapp || "";
      document.getElementById("cfgMoneda").value = config.moneda || "$";
      updateCartUI();
    }

    function populateCategories() {
      const select = document.getElementById("categoryFilter");
      const current = select.value;
      const cats = [...new Set(products.map(p => (p.categoria || "").trim()).filter(Boolean))];
      select.innerHTML = `<option value="todas">Todas las categorías</option>` +
        cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
      if (cats.includes(current)) select.value = current;
    }

    function renderCatalog() {
      const grid = document.getElementById("catalogGrid");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const cat = document.getElementById("categoryFilter").value;

      const filtered = products.filter(p => {
        const matchCat = cat === "todas" || (p.categoria || "") === cat;
        const matchText = !query ||
          (p.nombre || "").toLowerCase().includes(query) ||
          (p.descripcion || "").toLowerCase().includes(query);
        return matchCat && matchText;
      });

      if (filtered.length === 0) {
        grid.innerHTML = "";
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const imgSrc = p.imagen && p.imagen.trim()
          ? escapeHtml(p.imagen.trim())
          : "https://via.placeholder.com/400x250/20242e/9ca3af?text=Producto";
        return `
          <article class="product-card">
            <img class="product-img" src="${imgSrc}" alt="${escapeHtml(p.nombre)}" onerror="this.src='https://via.placeholder.com/400x250/20242e/9ca3af?text=Sin+imagen'" />
            <div class="product-body">
              <div class="product-cat">${escapeHtml(p.categoria || "General")}</div>
              <div class="product-title">${escapeHtml(p.nombre)}</div>
              <div class="product-desc">${escapeHtml(p.descripcion || "")}</div>
              <div class="product-price">${escapeHtml(config.moneda || "$")}${Number(p.precio || 0).toFixed(2)}</div>
              <button class="btn-primary btn-sm" style="margin-top:8px;" onclick="addToCart(${p.id})">Agregar al carrito</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function addToCart(productId) {
      const prod = products.find(p => Number(p.id) === Number(productId));
      if (!prod) return;
      const existing = cart.find(item => Number(item.id) === Number(productId));
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...prod, qty: 1 });
      }
      updateCartUI();
    }

    function changeQty(productId, delta) {
      const idx = cart.findIndex(item => Number(item.id) === Number(productId));
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      updateCartUI();
      renderCartModal();
    }

    function updateCartUI() {
      const totalItems = cart.reduce((acc, item) => acc + item.qty, 0);
      const totalAmount = cart.reduce((acc, item) => acc + Number(item.precio || 0) * item.qty, 0);
      const currency = config.moneda || "$";

      document.getElementById("cartCount").textContent = totalItems;
      document.getElementById("cartBarItems").textContent = `${totalItems} producto${totalItems === 1 ? "" : "s"}`;
      document.getElementById("cartBarTotal").textContent = `Total: ${currency}${totalAmount.toFixed(2)}`;
      document.getElementById("cartTotalText").textContent = `Total: ${currency}${totalAmount.toFixed(2)}`;
      document.getElementById("cartBar").style.display = totalItems > 0 ? "flex" : "none";
    }

    function renderCartModal() {
      const list = document.getElementById("cartItemsList");
      const currency = config.moneda || "$";
      if (cart.length === 0) {
        list.innerHTML = `<p class="status-msg">Tu carrito está vacío.</p>`;
        return;
      }
      list.innerHTML = cart.map(item => `
        <div class="admin-item">
          <div>
            <strong>${escapeHtml(item.nombre)}</strong>
            <div class="status-msg" style="margin:0;">${currency}${Number(item.precio || 0).toFixed(2)} c/u</div>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="btn-secondary btn-sm" onclick="changeQty(${item.id}, -1)">-</button>
            <span>${item.qty}</span>
            <button class="btn-secondary btn-sm" onclick="changeQty(${item.id}, 1)">+</button>
          </div>
        </div>
      `).join("");
    }

    document.getElementById("btnSendWhatsApp").addEventListener("click", () => {
      if (cart.length === 0) return;
      const phone = (config.whatsapp || "").replace(/\D/g, "");
      if (!phone) {
        alert("El número de WhatsApp de la tienda no está configurado.");
        return;
      }
      const currency = config.moneda || "$";
      const customer = document.getElementById("customerName").value.trim();
      let lines = [`Hola, quiero hacer un pedido en *${config.nombre_tienda || "la tienda"}*:`];
      if (customer) lines.push(`Cliente: ${customer}`);
      lines.push("");

      let total = 0;
      cart.forEach(item => {
        const sub = Number(item.precio || 0) * item.qty;
        total += sub;
        lines.push(`• ${item.qty}x ${item.nombre} (${currency}${sub.toFixed(2)})`);
      });

      lines.push("", `*Total: ${currency}${total.toFixed(2)}*`);
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(lines.join("
"))}`;
      window.open(url, "_blank");
    });

    function openModal(id) {
      document.getElementById(id).classList.add("active");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("active");
    }

    document.getElementById("btnOpenCart").addEventListener("click", () => {
      renderCartModal();
      openModal("cartModal");
    });

    document.getElementById("btnQuickCart").addEventListener("click", () => {
      renderCartModal();
      openModal("cartModal");
    });

    document.getElementById("btnOpenAdmin").addEventListener("click", () => {
      syncAdminView();
      openModal("adminModal");
    });

    function syncAdminView() {
      document.getElementById("loginBox").style.display = isLoggedIn ? "none" : "block";
      document.getElementById("adminPanel").style.display = isLoggedIn ? "block" : "none";
      document.getElementById("adminModalTitle").textContent = isLoggedIn ? "Panel de Administración" : "Acceso Administrador";
    }

    document.getElementById("btnLogin").addEventListener("click", () => {
      const u = document.getElementById("adminUser").value.trim();
      const p = document.getElementById("adminPass").value;
      const errEl = document.getElementById("loginError");
      if (u === ADMIN_USER && p === ADMIN_PASS) {
        isLoggedIn = true;
        errEl.textContent = "";
        document.getElementById("adminPass").value = "";
        syncAdminView();
      } else {
        errEl.textContent = "Usuario o contraseña incorrectos.";
      }
    });

    document.getElementById("btnLogout").addEventListener("click", () => {
      isLoggedIn = false;
      syncAdminView();
    });

    document.getElementById("btnSaveConfig").addEventListener("click", async () => {
      const statusEl = document.getElementById("cfgStatus");
      statusEl.textContent = "Guardando configuración...";
      const payload = {
        id: 1,
        nombre_tienda: document.getElementById("cfgNombre").value.trim() || "Mi Tienda Digital",
        whatsapp: document.getElementById("cfgWhatsapp").value.trim() || "584120000000",
        moneda: document.getElementById("cfgMoneda").value.trim() || "$"
      };
      try {
        const updated = await sbFetch("configuracion?id=eq.1", {
          method: "PATCH",
          body: JSON.stringify(payload)
        });
        if (Array.isArray(updated) && updated.length > 0) {
          config = updated[0];
        } else {
          config = payload;
        }
        applyConfigToUI();
        renderCatalog();
        statusEl.textContent = "Configuración guardada en Supabase.";
      } catch (err) {
        statusEl.textContent = `Error al guardar: ${err.message}`;
      }
    });

    document.getElementById("btnAddProduct").addEventListener("click", async () => {
      const statusEl = document.getElementById("prodStatus");
      const nombre = document.getElementById("prodNombre").value.trim();
      const categoria = document.getElementById("prodCategoria").value.trim() || "General";
      const precio = parseFloat(document.getElementById("prodPrecio").value);
      const imagen = document.getElementById("prodImagen").value.trim();
      const descripcion = document.getElementById("prodDesc").value.trim();

      if (!nombre || isNaN(precio)) {
        statusEl.textContent = "Completa al menos el nombre y un precio válido.";
        return;
      }

      statusEl.textContent = "Publicando producto...";
      try {
        const created = await sbFetch("productos", {
          method: "POST",
          body: JSON.stringify({ nombre, categoria, precio, imagen, descripcion })
        });
        if (Array.isArray(created) && created.length > 0) {
          products.unshift(created[0]);
        }
        document.getElementById("prodNombre").value = "";
        document.getElementById("prodPrecio").value = "";
        document.getElementById("prodImagen").value = "";
        document.getElementById("prodDesc").value = "";
        populateCategories();
        renderCatalog();
        renderAdminProducts();
        statusEl.textContent = "Producto guardado en Supabase.";
      } catch (err) {
        statusEl.textContent = `Error al publicar: ${err.message}`;
      }
    });

    function renderAdminProducts() {
      const container = document.getElementById("adminProductsList");
      if (products.length === 0) {
        container.innerHTML = `<p class="status-msg">Sin productos.</p>`;
        return;
      }
      container.innerHTML = products.map(p => `
        <div class="admin-item">
          <div>
            <strong>${escapeHtml(p.nombre)}</strong>
            <div class="status-msg" style="margin:0;">${escapeHtml(config.moneda || "$")}${Number(p.precio || 0).toFixed(2)} · ${escapeHtml(p.categoria || "General")}</div>
          </div>
          <button class="btn-danger btn-sm" onclick="deleteProduct(${p.id})">Eliminar</button>
        </div>
      `).join("");
    }

    async function deleteProduct(id) {
      try {
        await sbFetch(`productos?id=eq.${id}`, { method: "DELETE" });
        products = products.filter(p => Number(p.id) !== Number(id));
        cart = cart.filter(item => Number(item.id) !== Number(id));
        updateCartUI();
        populateCategories();
        renderCatalog();
        renderAdminProducts();
      } catch (err) {
        alert(`No se pudo eliminar: ${err.message}`);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.getElementById("searchInput").addEventListener("input", renderCatalog);
    document.getElementById("categoryFilter").addEventListener("change", renderCatalog);

    loadStoreData();
  </script>
</body>
</html>
